name: Backend CI

on:
  push:
    branches: [09-dev, 10-dev, 11-dev, 12-dev, 13-dev, 14-dev, 15-dev, 16-dev]
  pull_request:
    branches: [09-dev, 10-dev, 11-dev, 12-dev, 13-dev, 14-dev, 15-dev, 16-dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --config prisma7.config.ts

      - name: Lint without modifying files
        run: >-
          npx eslint "src/**/*.ts" "test/**/*.ts" --rule 'prettier/prettier: off'

      - name: Unit tests
        run: npm test -- --runInBand

      - name: Compile production bundle
        run: npm run build

      - name: Build runtime container
        run: docker build --pull --tag smarthome-backend:${{ github.sha }} .
