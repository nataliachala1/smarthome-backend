name: PR validation (dev) - no deploy

# Validation of EVERY pull request to dev, whatever the branch name.
# It only checks the code: it does NOT publish GHCR images, use secrets,
# webhooks, deploy to Dokploy or connect to VPS databases.
# The pr-shelly-mqtt-dev.yml workflow is kept unchanged for its branches.

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: pr-validate-dev-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, typecheck, unit tests and build (no deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MQTT_ENABLED: 'false'
      SHELLY_MQTT_DEV_DI_ENABLED: 'false'
      SHELLY_MQTT_VPS_DEV_PAIRING_ENABLED: 'false'
      SHELLY_MQTT_VPS_DEV_REVOCATION_WORKER_ENABLED: 'false'
      SHELLY_MQTT_VPS_DEV_AUTH_WORKER_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: TypeScript check
        run: npx tsc --noEmit -p tsconfig.build.json
      - name: Unit tests
        run: npm run test:cov -- --runInBand
      - name: Build
        run: npm run build
      - name: Isolated MQTT namespace security E2E
        run: npm run test:e2e -- --runInBand --runTestsByPath test/mqtt-namespace-security.e2e-spec.ts
