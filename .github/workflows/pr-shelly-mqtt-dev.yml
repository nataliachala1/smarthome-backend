name: PR Shelly MQTT DEV - validation only

on:
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/pr-shelly-mqtt-dev.yml'
      - 'src/**'
      - 'test/**'
      - 'prisma/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'nest-cli.json'

permissions:
  contents: read

concurrency:
  group: shelly-pr-validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify backend (no deploy)
    if: ${{ github.event.pull_request.head.ref == 'feat/shelly-mqtt-backend-vps' || github.event.pull_request.head.ref == 'fix/mqtt-ingest-consumption-online' || github.event.pull_request.head.ref == 'feat/flespi-mqtt-vps-dev' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MQTT_ENABLED: 'false'
      SHELLY_MQTT_DEV_DI_ENABLED: 'false'
      SHELLY_MQTT_VPS_DEV_PAIRING_ENABLED: 'false'
      SHELLY_MQTT_VPS_DEV_REVOCATION_WORKER_ENABLED: 'false'
      SHELLY_MQTT_VPS_DEV_AUTH_WORKER_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: TypeScript check
        run: npx tsc --noEmit -p tsconfig.build.json
      - name: Unit tests
        run: npm test -- --runInBand
      - name: Build
        run: npm run build
      - name: Isolated MQTT namespace security E2E
        run: npm run test:e2e -- --runInBand --runTestsByPath test/mqtt-namespace-security.e2e-spec.ts
